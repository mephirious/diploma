name: sport_booking
description: Sport Facilities Reservation and Management Platform
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  flutter_localizations:
    sdk: flutter

  flutter_dotenv: ^5.1.0
  
  cupertino_icons: ^1.0.6
  
  dio: ^5.4.0
  flutter_riverpod: ^2.4.9
  riverpod_annotation: ^2.3.3
  
  freezed_annotation: ^2.4.1
  json_annotation: ^4.8.1
  
  dart_jsonwebtoken: ^2.8.0  # for decoding JWT payload
  flutter_secure_storage: ^9.0.0
  shared_preferences: ^2.2.2
  
  go_router: ^13.0.0
  
  intl: ^0.20.2
  
  url_launcher: ^6.2.3
  
  glassmorphism: ^3.0.0
  timezone: ^0.11.0
  web_socket_channel: ^3.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  
  flutter_lints: ^3.0.0
  
  build_runner: ^2.4.7
  freezed: ^2.4.6
  json_serializable: ^6.7.1
  riverpod_generator: ^2.3.9

flutter:
  uses-material-design: true
  generate: true
  assets:
    - .env
    - assets/banks/

